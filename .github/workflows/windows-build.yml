name: Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:fast
      - run: npm run make:win
      - run: npm run test:package:win
      - uses: actions/upload-artifact@v4
        with:
          name: 弹幕看板-windows-x64
          path: out/make/zip/win32/x64/*.zip
          if-no-files-found: error
          retention-days: 14

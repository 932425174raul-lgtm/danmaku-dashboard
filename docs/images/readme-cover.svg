<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title description">
  <title id="title">弹幕看板</title>
  <desc id="description">一个面向Apple Silicon Mac的本地实时弹幕与数据看板。</desc>

  <rect width="1600" height="600" rx="28" fill="#0a090c"/>
  <rect x="1" y="1" width="1598" height="598" rx="27" fill="none" stroke="#2a272e" stroke-width="2"/>

  <path d="M0 2h266" stroke="#e85955" stroke-width="4"/>
  <path d="M266 2h266" stroke="#ef8b45" stroke-width="4"/>
  <path d="M532 2h268" stroke="#e9cf63" stroke-width="4"/>
  <path d="M800 2h266" stroke="#79b875" stroke-width="4"/>
  <path d="M1066 2h266" stroke="#63a9ce" stroke-width="4"/>
  <path d="M1332 2h268" stroke="#9a7bc7" stroke-width="4"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="96" y="112" fill="#88817a" font-size="22" font-weight="500">B站 · 抖音公开直播间</text>
    <text x="92" y="228" fill="#f1eee8" font-size="92" font-weight="700" letter-spacing="-2">弹幕看板</text>
    <text x="98" y="294" fill="#aba59d" font-size="29" font-weight="400">实时获取、本地存储，在直播当下看见观众反应。</text>

    <path d="M98 354H748" stroke="#2a272e" stroke-width="2"/>

    <text x="98" y="406" fill="#f1eee8" font-size="21" font-weight="600">实时弹幕与看板</text>
    <text x="98" y="444" fill="#88817a" font-size="19">趋势、排行与缺口标记</text>

    <text x="378" y="406" fill="#f1eee8" font-size="21" font-weight="600">数据保存在本机</text>
    <text x="378" y="444" fill="#88817a" font-size="19">搜索、分页与整场删除</text>

    <text x="650" y="406" fill="#f1eee8" font-size="21" font-weight="600">Apple Silicon</text>
    <text x="650" y="444" fill="#88817a" font-size="19">macOS 13或更高版本</text>

    <text x="98" y="526" fill="#88817a" font-size="18">匿名连接公开直播间 · 不读取Cookie · 关闭窗口后可在菜单栏继续采集</text>
  </g>

